# This is the root key, which should be the domain name for your network.
your.domain.name:
  # --- OPNsense Connection Details ---
  opnsense:
    host: "http://opnsense.ip.address/" # URL for your OPNsense firewall

  # --- WAN Interface ---
  # The physical interface name on OPNsense that is your WAN connection.
  wan_interface: optX 

  # --- Custom DNS Forwarding ---
  # Defines DNS queries to be forwarded to specific servers.
  # Useful for routing internal domains or using services like AdGuard.
  # NOTE: VLAN-based DNS forwarding (to dnsmasq) is automatically generated.
  dns_forwards:
    - domain: ""              # A blank domain acts as a catch-all forwarder
      server: "192.168.1.10"  # IP of the DNS server to forward to
      port: 53
      description: "AdGuard Home"
    - domain: "internal.domain"
      server: "192.168.1.1"
      port: 53
      description: "Internal DNS"

  # --- Unbound DNS Host Overrides ---
  # Defines host overrides in Unbound DNS (A records).
  # FQDN is automatically split into hostname + domain for the API.
  host_overrides:
    - hostname: "service.domain"  # FQDN - will be split to hostname="service", domain="domain"
      ip: "192.168.1.100"
      description: "Internal service"
    - hostname: "*.wildcard"       # Wildcard hostname support
      ip: "192.168.1.200"
      description: "Wildcard DNS entry"

  # --- Connectivity Tests ---
  # Defines DNS and connectivity validation tests used by the validator.
  # These tests are applied to all VLANs during validation.
  connectivity_tests:
    reverse_lookup:
      ip: 192.168.21.10         # IP to perform reverse DNS lookup (PTR query)
      fqdn: "host.domain.com"   # Expected FQDN from PTR record
    internal_lookup:
      host: "hostname"          # Internal hostname (will append domain if no dots)
      ip: 192.168.21.10         # Expected resolved IP address
    external_lookup:
      host: "one.one.one.one"   # External hostname to resolve
      ip: 1.1.1.1               # Expected resolved IP (checks if in A records)
    overridden_lookup:
      host: "external.com"      # Hostname with DNS override configured
      ip: 192.168.23.1          # Expected internal IP (from DNS override)

  # --- VLAN Definitions ---
  # Each key under 'vlans' is a new VLAN.
  vlans:
    # Example of a management VLAN with no DHCP server, only static leases.
    management:
      id: 10
      interface: vtnet1 # Physical interface this VLAN is tagged on
      cidr: 192.168.10.0/24
      gateway: 192.168.10.1
      dhcp: false # DHCP server is disabled for this VLAN
      private_network: true # Allows access to other private networks
      public_network: true  # Allows access to the internet
      dhcp_options:
        42: gateway # DHCP option 42 (NTP) will be the VLAN's gateway
      static_leases:
        my-server:
          hostname: my-server
          ip: 192.168.10.5
          mac: 00:11:22:33:44:55

    # Example of a server VLAN with a DHCP server range.
    servers:
      id: 20
      parent: vtnet2 # Alternative to 'interface'
      cidr: 192.168.20.0/24
      gateway: 192.168.20.1
      dhcp:
        range: [192.168.20.100, 192.168.20.200] # DHCP pool
      private_network: true
      public_network: true
      dhcp_options:
        # Simple value for DHCP option
        42: gateway
        # Complex value with a description
        66:
          value: 192.168.20.6
          description: "TFTP server for PXE boot"
      static_leases:
        # ... more static leases ...
        
  # --- FreeRADIUS Users ---
  # Defines users for MAC-based authentication (e.g., WPA2-Enterprise).
  # Each top-level item is a list of users for a specific VLAN.
  free_radius_users:
    - trusted_clients: # VLAN name
        - mac: AA:BB:CC:DD:EE:FF
          description: "my-laptop"
        - mac: 11:22:33:44:55:66
          description: "my-phone"

  # --- Service Aliases ---
  # Defines aliases for services (IP + ports) to be used in firewall rules.
  services:
    adguard:
      ip: 192.168.21.10
      ports: [53, 853]
    unifi:
      ip: 192.168.21.11
      ports: [8443, 8080, 3478]

  # --- Firewall Policies ---
  # Defines firewall rules based on zones (VLANs).
  # Rules are generated from the perspective of the source VLAN.
  policies:
    trusted_clients: # Source VLAN
      allow:
        - adguard     # Allow traffic to the 'adguard' service alias
        - servers     # Allow traffic to the entire 'servers' VLAN
        - internet    # Keyword for allowing internet access
      deny:
        - guest       # Deny traffic to the 'guest' VLAN
    iot_local:
      allow:
        - adguard
      deny_internet: true # Keyword to block all internet access

  # --- HAProxy Configuration ---
  # Defines HAProxy load balancer for high availability and load distribution.
  haproxy:
    enabled: true
    bind_address: "192.168.21.1"  # IP address where frontends bind
    
    stats:
      enabled: true
      uri: /haproxy_stats
      refresh: 10s
    
    # Backend server pools
    backends:
      app_backend:
        mode: http                # http or tcp
        balance: roundrobin       # roundrobin, leastconn, source
        
        # Health check configuration
        health_check:
          method: HEAD            # HTTP method (for HTTP mode)
          uri: /health            # Health check endpoint (for HTTP mode)
          port: 8080              # Health check port
          check_interval: 5s      # Check frequency
        
        # Service port for all servers in this backend
        service:
          port: 80
        
        # Optional: HAProxy backend options
        options:
          - forwardfor
          - http-server-close
        
        # Optional: HTTP request header manipulation
        http_request:
          - action: set-header    # set-header or add-header
            name: X-Real-IP
            value: "%[src]"
          - action: add-header
            name: X-Forwarded-Proto
            value: "https"
        
        # Optional: Custom timeouts (HAProxy tuning settings)
        timeout_connect: 10s      # Maximum time to wait for a connection to be established        
        timeout_server: 300s      # Wait for server to respond
        timeout_tunnel: 1h        # For WebSocket/L4 tunnel connections
        
        # Backend servers (must reference hostnames from static_leases)
        servers:
          - name: server1         # Hostname from static_leases
          - name: server2
          - name: server3
      
      tcp_backend:
        mode: tcp
        balance: leastconn
        health_check:
          port: 3306              # For TCP, only port is needed
          check_interval: 10s
        service:
          port: 3306
        servers:
          - name: db-server1
          - name: db-server2
    
    # Frontend listeners
    frontends:
      web_http:
        bind_port: 80
        mode: http
        default_backend: app_backend
        stats_enabled: true       # Enable stats on this frontend
      
      web_https:
        bind_port: 443
        mode: http
        ssl: true                 # Enable SSL/TLS
        ssl_cert: "example.com"   # Certificate name (linked from Opnsense Trust store)
        default_backend: app_backend
        timeout_client: 300s      # Wait for client to send data
        stats_enabled: true
      
      mysql:
        bind_port: 3306
        mode: tcp
        default_backend: tcp_backend
